[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-eval-mlflow"
version = "0.1.0"
description = "MLflow-tracked multi-seed ablation over a deterministic, offline agent evaluation benchmark (tool use + RAG)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "coindef" }]
dependencies = ["mlflow>=2.12", "numpy>=1.26", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_eval_mlflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# Perturbations and LatencyModel defaults are frozen dataclasses, safe as defaults.
ignore = ["B008"]
